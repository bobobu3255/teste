<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Telegram Collector Pro v12.0 — Cyberpunk Edition">
  <title>Telegram Collector Pro v12.0 — Cyberpunk Edition</title>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Cyan accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Logo hex gradient -->
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- Diagonal stripes -->
    <pattern id="stripes" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Layered background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Soft cyan glow blobs -->
  <circle cx="120"  cy="200" r="220" fill="#06b6d4" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1180" cy="80"  r="160" fill="#22d3ee" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1100" cy="360" r="180" fill="#0ea5b7" opacity="0.07" filter="url(#softGlow)"/>

  <!-- Top/bottom accent lines -->
  <rect x="0" y="0"   width="1280" height="2" fill="url(#accent)" opacity="0.55"/>
  <rect x="0" y="398" width="1280" height="2" fill="url(#accent)" opacity="0.55"/>

  <!-- Left bracket / corner detail -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.85" filter="url(#glow)">
    <polyline points="40,40 24,40 24,80"/>
    <polyline points="40,360 24,360 24,320"/>
    <polyline points="1240,40 1256,40 1256,80"/>
    <polyline points="1240,360 1256,360 1256,320"/>
  </g>

  <!-- ============ LOGO HEX ============ -->
  <g transform="translate(120,200)">
    <!-- Outer hex -->
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46"
             fill="none" stroke="url(#hex)" stroke-width="3" filter="url(#glow)"/>
    <!-- Inner hex -->
    <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33"
             fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.65"/>
    <!-- Stripes badge -->
    <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33"
             fill="url(#stripes)"/>
    <!-- TC monogram -->
    <text x="0" y="14" text-anchor="middle"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-weight="800" font-size="48" fill="url(#accent)" filter="url(#glow)">TC</text>
    <!-- Corner dots -->
    <circle cx="0"   cy="-92" r="4" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="80"  cy="-46" r="3" fill="#06b6d4"/>
    <circle cx="80"  cy="46"  r="3" fill="#06b6d4"/>
    <circle cx="0"   cy="92"  r="4" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="-80" cy="46"  r="3" fill="#06b6d4"/>
    <circle cx="-80" cy="-46" r="3" fill="#06b6d4"/>
  </g>

  <!-- ============ TEXT BLOCK ============ -->
  <g transform="translate(260,120)">

    <!-- Eyebrow -->
    <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" letter-spacing="4">
      <text x="0" y="0" fill="#22d3ee" filter="url(#glow)">▎ DESKTOP&#160;SUITE</text>
      <text x="170" y="0" fill="#94a3b8">// V12.0&#160;PREVIEW</text>
    </g>

    <!-- Main title -->
    <text x="0" y="60"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-weight="900" font-size="64" letter-spacing="-1"
          fill="#f1f5f9">TELEGRAM&#160;COLLECTOR</text>
    <text x="0" y="120"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-weight="900" font-size="64" letter-spacing="-1"
          fill="url(#accent)" filter="url(#glow)">PRO<tspan fill="#f1f5f9" font-weight="300"> · CYBERPUNK&#160;EDITION</tspan></text>

    <!-- Tagline -->
    <text x="2" y="158"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-size="18" fill="#94a3b8">
      Coleta · automação · navegação segura · IA local — tudo numa única suíte desktop.
    </text>

    <!-- Tech pills -->
    <g transform="translate(0,190)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="600">
      <g>
        <rect x="0" y="0" width="118" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="14" cy="14" r="4" fill="#22d3ee" filter="url(#glow)"/>
        <text x="26" y="18" fill="#e2e8f0">PYTHON 3.9+</text>
      </g>
      <g transform="translate(130,0)">
        <rect x="0" y="0" width="92" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="14" cy="14" r="4" fill="#22d3ee" filter="url(#glow)"/>
        <text x="26" y="18" fill="#e2e8f0">PYQT5</text>
      </g>
      <g transform="translate(234,0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="14" cy="14" r="4" fill="#22d3ee" filter="url(#glow)"/>
        <text x="26" y="18" fill="#e2e8f0">SQLITE&#160;CORE</text>
      </g>
      <g transform="translate(366,0)">
        <rect x="0" y="0" width="148" height="28" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="14" cy="14" r="4" fill="#22d3ee" filter="url(#glow)"/>
        <text x="26" y="18" fill="#e2e8f0">CYBERPUNK&#160;UI</text>
      </g>
      <g transform="translate(526,0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-opacity="0.7"/>
        <circle cx="14" cy="14" r="4" fill="#10b981"/>
        <text x="26" y="18" fill="#e2e8f0">15+&#160;FEATURES</text>
      </g>
    </g>
  </g>

  <!-- Right-side terminal block -->
  <g transform="translate(940,80)" font-family="'JetBrains Mono', 'Consolas', monospace">
    <rect x="0" y="0" width="280" height="240" rx="10"
          fill="#0a0e1a" stroke="#22d3ee" stroke-opacity="0.45"/>
    <!-- Terminal header -->
    <rect x="0" y="0" width="280" height="28" rx="10" fill="#111827"/>
    <rect x="0" y="14" width="280" height="14" fill="#111827"/>
    <circle cx="16" cy="14" r="5" fill="#f43f5e"/>
    <circle cx="34" cy="14" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="14" r="5" fill="#10b981"/>
    <text x="140" y="18" text-anchor="middle" font-size="11" fill="#94a3b8">tcp · launcher</text>

    <!-- Terminal body -->
    <g font-size="12" fill="#cbd5e1">
      <text x="14" y="56"><tspan fill="#22d3ee">$</tspan> python run.py</text>
      <text x="14" y="78" fill="#64748b">› bootstrapping core...</text>
      <text x="14" y="98" fill="#10b981">✓ database     ready</text>
      <text x="14" y="118" fill="#10b981">✓ workers      ready</text>
      <text x="14" y="138" fill="#10b981">✓ theme        cyber</text>
      <text x="14" y="158" fill="#10b981">✓ features     15/15</text>
      <text x="14" y="180" fill="#94a3b8">› launching shell...</text>
      <text x="14" y="208"><tspan fill="#22d3ee">▌</tspan> <tspan fill="#f1f5f9">ready · v12.0</tspan></text>
    </g>
  </g>

  <!-- Bottom signature line -->
  <g transform="translate(120,360)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#475569">
    <text x="0" y="0">// crafted with neon &amp; caffeine · bobobu3255</text>
  </g>
</svg>
