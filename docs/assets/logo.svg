<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Telegram Collector Pro logo">
  <title>Telegram Collector Pro</title>
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="lg-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="lg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#lg-bg)"/>

  <g transform="translate(128,128)">
    <polygon points="0,-86 75,-43 75,43 0,86 -75,43 -75,-43"
             fill="none" stroke="url(#lg-hex)" stroke-width="4" filter="url(#lg-glow)"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
             fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="14" text-anchor="middle"
          font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
          font-weight="800" font-size="46"
          fill="url(#lg-hex)" filter="url(#lg-glow)">TC</text>
    <circle cx="0"   cy="-86" r="4" fill="#22d3ee" filter="url(#lg-glow)"/>
    <circle cx="0"   cy="86"  r="4" fill="#22d3ee" filter="url(#lg-glow)"/>
    <circle cx="75"  cy="-43" r="3" fill="#06b6d4"/>
    <circle cx="75"  cy="43"  r="3" fill="#06b6d4"/>
    <circle cx="-75" cy="-43" r="3" fill="#06b6d4"/>
    <circle cx="-75" cy="43"  r="3" fill="#06b6d4"/>
  </g>
</svg>
