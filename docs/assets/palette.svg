<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-label="Cyberpunk Neon palette">
  <title>Cyberpunk Neon — paleta oficial v12</title>
  <defs>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font: 600 12px 'JetBrains Mono', Consolas, monospace; fill: #e2e8f0; }
      .hex  { font: 500 11px 'JetBrains Mono', Consolas, monospace; fill: #94a3b8; }
      .ttl  { font: 800 16px 'Segoe UI', Inter, system-ui, sans-serif; fill: #f1f5f9; letter-spacing: 1px; }
      .sub  { font: 500 11px 'JetBrains Mono', Consolas, monospace; fill: #22d3ee; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="880" height="220" rx="14" fill="#0a0e1a" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="24" y="34" class="sub">▎ PALETTE</text>
  <text x="24" y="58" class="ttl">CYBERPUNK · NEON</text>

  <!-- Swatches -->
  <g transform="translate(24,86)">
    <!-- bg -->
    <g>
      <rect width="120" height="100" rx="10" fill="#0a0e1a" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="12" y="22" class="lbl">BG / DEEP</text>
      <text x="12" y="86" class="hex">#0a0e1a</text>
    </g>
    <!-- bg2 -->
    <g transform="translate(132,0)">
      <rect width="120" height="100" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="12" y="22" class="lbl">BG / SURFACE</text>
      <text x="12" y="86" class="hex">#111827</text>
    </g>
    <!-- accent -->
    <g transform="translate(264,0)" filter="url(#p-glow)">
      <rect width="120" height="100" rx="10" fill="#06b6d4"/>
      <text x="12" y="22" class="lbl" fill="#0a0e1a">ACCENT</text>
      <text x="12" y="86" class="hex" fill="#0a0e1a">#06b6d4</text>
    </g>
    <!-- accent light -->
    <g transform="translate(396,0)" filter="url(#p-glow)">
      <rect width="120" height="100" rx="10" fill="#22d3ee"/>
      <text x="12" y="22" class="lbl" fill="#0a0e1a">ACCENT · LIGHT</text>
      <text x="12" y="86" class="hex" fill="#0a0e1a">#22d3ee</text>
    </g>
    <!-- success -->
    <g transform="translate(528,0)">
      <rect width="100" height="100" rx="10" fill="#10b981"/>
      <text x="10" y="22" class="lbl" fill="#0a0e1a">SUCCESS</text>
      <text x="10" y="86" class="hex" fill="#0a0e1a">#10b981</text>
    </g>
    <!-- warn -->
    <g transform="translate(640,0)">
      <rect width="100" height="100" rx="10" fill="#f59e0b"/>
      <text x="10" y="22" class="lbl" fill="#0a0e1a">WARNING</text>
      <text x="10" y="86" class="hex" fill="#0a0e1a">#f59e0b</text>
    </g>
    <!-- danger -->
    <g transform="translate(752,0)">
      <rect width="100" height="100" rx="10" fill="#f43f5e"/>
      <text x="10" y="22" class="lbl" fill="#0a0e1a">DANGER</text>
      <text x="10" y="86" class="hex" fill="#0a0e1a">#f43f5e</text>
    </g>
  </g>
</svg>
